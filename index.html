<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/styles.css">
    <script src="./script/script.js" defer></script>
    <title>TIC TAC TOE</title>
</head>
<body>
    <div class="main_wrapper">
        <div class="heading">
            <h1>
                <span>TIC</span> 
                <span>TAC</span>
                <span>TOE</span>
            </h1>
        </div>

        <div class="leader_board">
            <div>
                <span><img src="./assets/x.svg" alt="cross icon"></span>
                <p class="player_x_name">Player X</p>
                <span class="x_score">0</span>
            </div>
            <div>
                <span><img src="./assets/circle-slash-2.svg" alt="draw icon"></span>
                <p>Draw</p>
                <span class="draw_score">score</span>
            </div>
            <div>
                <span><img src="./assets/circle.svg" alt="circle icon"></span>
                <p class="player_o_name">Player O</p>
                <span class="o_score">0</span>
            </div>
        </div>

        <div class="turn">
            <p>CURRENT TURN IS: </p>
            <span></span>
        </div>

        <div class="board">
        </div>

        <div class="actions">
            <button>New Game</button>
        </div>
        
    </div>
</body>
</html>
